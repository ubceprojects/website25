<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/logo-min.png" />

        <!-- Preconnect to third-party origins to speed up font & icon loading -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://kit.fontawesome.com" />
        <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin />

        <!-- Google Fonts loaded here (not via a CSS @import) so the browser discovers them on the first HTML parse instead of after the bundled CSS downloads. Poppins trimmed to the weights actually used (200–800). -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Poppins:ital,wght@0,200;0,400;0,500;0,600;0,700;0,800;1,200;1,400;1,500;1,600;1,700;1,800&display=swap" />

        <!-- Preload the hero illustration (the LCP element) so it fetches in parallel with the JS instead of after React mounts. -->
        <link rel="preload" as="image" href="/Website Illustration-04.svg" type="image/svg+xml" />

        <link rel="stylesheet" href="/style.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <!-- Google Search Console Verification -->
        <meta name="google-site-verification" content="AZxsA56rCdNPDAWWoB67WCdw-8_O27aIVOux3JqCyAo" />
        
        <!-- Primary Meta Tags -->
        <title>UBC eProjects | Entrepreneurship Club at University of British Columbia</title>
        <meta name="title" content="UBC eProjects | Entrepreneurship Club at University of British Columbia" />
        <meta name="description" content="UBC eProjects is the premier student entrepreneurship club at the University of British Columbia. Join UBC eprojects to connect with entrepreneurs, attend networking events, and build your startup in Vancouver." />
        <meta name="keywords" content="UBC eprojects, UBC eProjects, UBC entrepreneurship club, UBC student entrepreneurs, UBC startup club, UBC business club, University of British Columbia entrepreneurship, UBC Vancouver entrepreneurs, eprojects UBC" />
        <meta name="author" content="UBC eProjects" />
        <meta name="robots" content="index, follow" />
        <meta name="language" content="English" />
        <meta name="revisit-after" content="7 days" />
        
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://eprojectsubc.com/" />
        <meta property="og:title" content="UBC eProjects | Entrepreneurship Club at University of British Columbia" />
        <meta property="og:description" content="UBC eProjects is the premier student entrepreneurship club at the University of British Columbia. Join UBC eprojects to connect with entrepreneurs, attend networking events, and build your startup in Vancouver." />
        <meta property="og:image" content="https://eprojectsubc.com/logo.png" />
        
        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://eprojectsubc.com/" />
        <meta property="twitter:title" content="UBC eProjects | Entrepreneurship Club at University of British Columbia" />
        <meta property="twitter:description" content="UBC eProjects is the premier student entrepreneurship club at the University of British Columbia. Join UBC eprojects to connect with entrepreneurs, attend networking events, and build your startup in Vancouver." />
        <meta property="twitter:image" content="https://eprojectsubc.com/logo.png" />
        
        <!-- Canonical URL -->
        <link rel="canonical" href="https://eprojectsubc.com/" />
        
        <!-- Structured Data (JSON-LD) for SEO -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "UBC eProjects",
          "alternateName": "UBC eprojects",
          "url": "https://eprojectsubc.com/",
          "logo": "https://eprojectsubc.com/logo.png",
          "description": "UBC eProjects is a student-run entrepreneurship club at the University of British Columbia connecting aspiring entrepreneurs and startup founders in Vancouver.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Vancouver",
            "addressRegion": "BC",
            "addressCountry": "CA"
          },
          "memberOf": {
            "@type": "EducationalOrganization",
            "name": "University of British Columbia",
            "alternateName": "UBC"
          },
          "sameAs": [
            "https://eprojectsubc.com/"
          ]
        }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
        <script defer src="https://kit.fontawesome.com/410f94a1ed.js" crossorigin="anonymous"></script>
    </body>
</html>
